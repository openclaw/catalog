name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "models/v1/catalog.json"
      - "models/v2/catalog.json"
      - "models/v3/catalog.json"
      - "scripts/**"
      - "static/**"
      - "wrangler.jsonc"
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      rollback_to:
        description: >-
          Rollback only: a commit on main whose v1/v2/v3 catalogs were good, or HEAD.
          Its content is republished with a fresh generatedAt. Leave empty for a normal publish.
        required: false
        default: ""
        type: string
      v3_min_version:
        description: >-
          Rollback only, emergency: v3 minVersion. Releases below it refuse every new v3
          file and keep the catalog they already have. See README "Rolling back".
        required: false
        default: ""
        type: string
      allow_shrink:
        description: >-
          Manual publish only: accept an intended drop of more than 5% of rows or of a whole
          provider (publisher --allow-shrink).
        required: false
        default: false
        type: boolean
      allow_row_loss:
        description: >-
          Manual publish or rollback: accept this many rows a released reader drops beyond
          its loss on the last published file (catalog-compare-released --allow-row-loss).
        required: false
        default: ""
        type: string
      skip_v3_check:
        description: >-
          Manual publish or rollback only, emergency: skip the v3 released-reader check for
          this run. Scheduled runs always check v3.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # publish: regenerate from openclaw. rollback: republish an earlier commit's
      # content. deploy: push events, and scheduled runs while publishing is paused
      # (repository variable CATALOG_PUBLISH_PAUSED=true) after a rollback.
      - name: Resolve run mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          V3_MIN_VERSION: ${{ inputs.v3_min_version }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          ALLOW_ROW_LOSS: ${{ inputs.allow_row_loss }}
          SKIP_V3: ${{ inputs.skip_v3_check }}
          PAUSED: ${{ vars.CATALOG_PUBLISH_PAUSED }}
        run: |
          set -euo pipefail
          if [[ -n "$ALLOW_ROW_LOSS" && ! "$ALLOW_ROW_LOSS" =~ ^[0-9]+$ ]]; then
            echo "::error::allow_row_loss must be a non-negative integer"
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            mode=deploy
          elif [ -n "$ROLLBACK_TO" ]; then
            mode=rollback
          elif [ -n "$V3_MIN_VERSION" ]; then
            echo "::error::v3_min_version needs rollback_to (use HEAD to keep the current content)"
            exit 1
          elif [ "$PAUSED" = true ]; then
            if [ "$ALLOW_SHRINK" = true ] || [ -n "$ALLOW_ROW_LOSS" ] || [ "$SKIP_V3" = true ]; then
              echo "::error::publishing is paused (CATALOG_PUBLISH_PAUSED); allow_shrink/allow_row_loss/skip_v3_check would have no effect"
              exit 1
            fi
            echo "::notice::Catalog publishing is paused (CATALOG_PUBLISH_PAUSED); deploying the committed catalog only"
            mode=deploy
          else
            mode=publish
          fi
          if [ "$mode" = rollback ] && [ "$ALLOW_SHRINK" = true ]; then
            echo "::error::allow_shrink applies to a regenerated catalog, not a rollback"
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "generate=$([ "$mode" = deploy ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Checkout catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A rollback reads catalogs from an earlier commit.
          fetch-depth: ${{ steps.mode.outputs.mode == 'rollback' && '0' || '1' }}

      - name: Checkout openclaw
        if: steps.mode.outputs.generate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          path: openclaw
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        if: steps.mode.outputs.generate == 'true'
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Assemble catalog
        if: steps.mode.outputs.mode == 'publish'
        working-directory: openclaw
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        # --previous*: refuse a feed that lost >5% of rows or a provider (shrink guard).
        # --skip-oversized-v1: an oversized v1 is not written and the published v1 stays;
        # v2/v3 still publish.
        run: |
          set -euo pipefail
          args=(--pricing
            --out ../models/v1/catalog.next.json --out-v2 ../models/v2/catalog.next.json --out-v3 ../models/v3/catalog.next.json
            --previous ../models/v1/catalog.json --previous-v2 ../models/v2/catalog.json --previous-v3 ../models/v3/catalog.json
            --skip-oversized-v1)
          if [ "$ALLOW_SHRINK" = true ]; then args+=(--allow-shrink); fi
          node --import tsx scripts/publish-model-catalog.mts "${args[@]}"

      # Clients keep the cached catalog with the newer generatedAt, so reverting or
      # redeploying an old file fixes nobody. Restore the content with a fresh stamp.
      - name: Restore last good catalog
        if: steps.mode.outputs.mode == 'rollback'
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          V3_MIN_VERSION: ${{ inputs.v3_min_version }}
        run: node scripts/rollback.mjs --from "$ROLLBACK_TO" --v3-min-version "$V3_MIN_VERSION" --openclaw openclaw

      # Released clients reject an unknown v1/v2 field and stop refreshing
      # (openclaw/openclaw#173027); row-tolerant readers drop rows and report success.
      # openclaw's `catalog-compare-released --check` fails on either, for every tagged
      # release that reads the feed. Fail before commit so the last good catalog stays
      # live. A release that defaults to the v3 URL must be checked as a v3 reader (README).
      - name: Check released readers
        if: steps.mode.outputs.generate == 'true'
        env:
          SKIP_V3: ${{ inputs.skip_v3_check }}
          ALLOW_ROW_LOSS: ${{ inputs.allow_row_loss }}
        run: |
          set -euo pipefail
          args=(--openclaw openclaw --allow-row-loss "$ALLOW_ROW_LOSS")
          if [ "$SKIP_V3" = true ]; then args+=(--skip-v3); fi
          node scripts/released-readers.mjs "${args[@]}"

      - name: Commit on change only
        if: steps.mode.outputs.generate == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          # A missing next file (v1 skipped by --skip-oversized-v1) keeps the published file.
          written=()
          for version in v1 v2 v3; do
            if [ -f "models/$version/catalog.next.json" ]; then written+=("$version"); fi
          done
          if [ ! -f models/v2/catalog.next.json ] || [ ! -f models/v3/catalog.next.json ]; then
            echo "::error::v2 and v3 must both be written (got: ${written[*]:-none})"
            exit 1
          fi
          if [[ " ${written[*]} " != *" v1 "* ]]; then
            echo "::warning::v1 was not regenerated (over the client size limit); the published v1 stays live"
          fi
          changed=false
          # generatedAt/sourceCommit differ every run; only content changes count.
          for version in "${written[@]}"; do
            new=$(jq -S 'del(.generatedAt, .sourceCommit)' "models/$version/catalog.next.json")
            cur=""
            if [ -f "models/$version/catalog.json" ]; then
              cur=$(jq -S 'del(.generatedAt, .sourceCommit)' "models/$version/catalog.json")
            fi
            if [ "$cur" != "$new" ]; then changed=true; fi
          done
          # A rollback must ship its fresh generatedAt even when the content matches main
          # (for example after a git revert redeployed an old stamp).
          if [ "$MODE" = rollback ]; then changed=true; fi
          if [ "$changed" = false ]; then
            echo "catalogs unchanged; skipping commit"
            rm -f models/v1/catalog.next.json models/v2/catalog.next.json models/v3/catalog.next.json
            exit 0
          fi
          # Keep all written versions on one source snapshot, even if only one changed.
          for version in "${written[@]}"; do
            mv "models/$version/catalog.next.json" "models/$version/catalog.json"
          done
          git config user.name "openclaw-catalog[bot]"
          git config user.email "catalog@openclaw.ai"
          git add models/v1/catalog.json models/v2/catalog.json models/v3/catalog.json
          # v2 has v1's providers and rows, and is always regenerated.
          summary=$(jq -r '"\(.providers | length) providers, \(.models | length) models"' models/v2/catalog.json)
          if [ "$MODE" = rollback ]; then
            git commit -m "catalog: roll back to $(git rev-parse --short "$ROLLBACK_TO^{commit}") content, $summary"
          else
            git commit -m "catalog: $summary"
          fi
          # The deploy below runs these on the same files; a catalog that would not
          # deploy must fail here, before it reaches main.
          node --test scripts/hosting.test.mjs scripts/guard.test.mjs
          node scripts/build.mjs
          git push origin HEAD:main

      # GITHUB_TOKEN commits do not trigger push workflows. Keep deployment in
      # this serialized job, including unchanged runs that retry a failed deploy.
      - name: Verify deployment source
        id: source
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$head" != "$remote" ]; then
            echo "::error::main advanced; refusing to deploy stale catalog $head"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Test and stage static assets
        run: |
          node --test scripts/hosting.test.mjs scripts/guard.test.mjs
          node scripts/build.mjs
          npx --yes wrangler@4.157.0 deploy --dry-run --env preview

      - name: Deploy and verify isolated preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/catalog-preview.jsonl
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 deploy --env preview --message "$SOURCE_SHA"
          preview_url=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(JSON.parse);
          const deploy = records.findLast((entry) => entry.type === 'deploy' && entry.worker_name === 'openclaw-catalog-preview');
          const url = deploy?.targets?.find((target) => /^https:\/\/openclaw-catalog-preview\.[a-z0-9-]+\.workers\.dev$/.test(target));
          if (!url) throw new Error('Preview deployment URL missing from Wrangler receipt');
          console.log(url);
          NODE
          )
          node scripts/smoke.mjs "$preview_url"

      - name: Deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$SOURCE_SHA" != "$remote" ]; then
            echo "::error::main advanced during preview; refusing to deploy stale catalog $SOURCE_SHA"
            exit 1
          fi
          npx --yes wrangler@4.157.0 deploy --env "" --message "$SOURCE_SHA"

      - name: Verify production
        run: node scripts/smoke.mjs https://catalog.openclaw.ai
