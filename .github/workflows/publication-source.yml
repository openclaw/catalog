name: Check publication admission

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  metadata:
    name: Check publication metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted base code runs with the status-writing token. Candidate
      # content, including fork code, is inspected through GitHub metadata only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - run: node scripts/publication.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
